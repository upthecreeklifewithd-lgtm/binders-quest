<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Binder's Quest</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#08080a}.stage{position:relative;width:min(100vw,430px);margin:auto}.screen{width:100%;display:block}
.hot{position:absolute;border:0;background:transparent}.sel{outline:4px solid #efbc4c;outline-offset:-4px;border-radius:9px}
.pathart{position:absolute;left:6.5%;top:50.3%;width:64%;height:12.5%;object-fit:fill;z-index:3}
.toast{position:absolute;left:10%;right:10%;bottom:8%;background:#8d2018;color:#ffe4a1;border:2px solid #d7a83f;padding:10px;text-align:center}
</style></head><body><div id="app"></div><script>
let s={page:1,path:null};const app=document.getElementById('app');
function h(a,st,c=''){return `<button class="hot ${c}" data-a="${a}" style="${st}"></button>`}
function r(){
if(s.page===1)app.innerHTML=`<div class=stage><img class=screen src="assets/01_welcome.png">${h('next','left:10%;right:10%;top:89%;height:7%')}</div>`;
else if(s.page===2)app.innerHTML=`<div class=stage><img class=screen src="assets/02_how_it_works.png">${h('next','left:13%;right:13%;top:91.5%;height:6%')}</div>`;
else if(s.page===3)app.innerHTML=`<div class=stage><img class=screen src="assets/03_choose_your_path.png">
${h('apprentice','left:3%;right:3%;top:37.1%;height:13.6%',s.path==='apprentice'?'sel':'')}
${h('scholar','left:3%;right:3%;top:50.2%;height:13.7%',s.path==='scholar'?'sel':'')}
${h('alchemist','left:3%;right:3%;top:62.7%;height:13.7%',s.path==='alchemist'?'sel':'')}
${h('master','left:3%;right:3%;top:75.8%;height:13.7%',s.path==='master'?'sel':'')}
${h('confirm','left:14%;right:14%;top:91%;height:5.8%')}</div>`;
else app.innerHTML=`<div class=stage><img class=screen src="assets/04_home.png">
${s.path&&s.path!=='apprentice'?`<img class=pathart src="assets/path_${s.path}.png">`:''}
${h('change','left:70%;right:10%;top:53.5%;height:6.7%')}
${h('start','left:11%;right:11%;top:80.5%;height:6%')}
${h('home','left:5%;width:18%;top:91%;height:8.5%')}
${h('pouch','left:23%;width:19%;top:91%;height:8.5%')}
${h('quest','left:42%;width:19%;top:91%;height:8.5%')}
${h('cabinet','left:61%;width:19%;top:91%;height:8.5%')}
${h('profile','left:80%;width:16%;top:91%;height:8.5%')}</div>`;
}
app.onclick=e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a;
if(a==='next')s.page++; else if(['apprentice','scholar','alchemist','master'].includes(a))s.path=a;
else if(a==='confirm'&&s.path)s.page=4; else if(a==='change')s.page=3;
else if(a==='start')alert('START MY QUEST works — Page 5 is not built yet.');
else if(['pouch','quest','cabinet','profile'].includes(a))alert(a.toUpperCase()+' works — page not built yet.');
r();scrollTo(0,0)};r();
</script></body></html>
