<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Binder's Quest — Correct Locked 3 Screen Playtest</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08080a}
#app{min-height:100svh;display:flex;justify-content:center;align-items:flex-start}
.stage{position:relative;width:min(100vw,430px);background:#08080a;overflow:hidden}
.screen{display:block;width:100%;height:auto}
.hot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}
.path.selected{outline:4px solid #efbc4c;outline-offset:-4px;border-radius:9px;box-shadow:0 0 18px rgba(239,188,76,.95)}
.msg{position:absolute;left:8%;right:8%;bottom:7%;padding:11px;background:rgba(18,12,14,.96);border:2px solid #c89535;color:#ffe3a0;text-align:center;border-radius:8px;font:bold 14px Georgia}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.76);display:flex;align-items:center;justify-content:center;padding:26px}
.box{width:100%;background:#ead4a1;border:3px solid #593512;outline:2px solid #c89636;border-radius:9px;padding:22px;text-align:center;font-family:Georgia;color:#28170d}
.box h2{color:#7b201b}
.box button{width:100%;padding:12px;background:#7b201b;color:#ffe7a5;border:2px solid #c89636;border-radius:7px;font:bold 15px Georgia}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
let s={screen:1,path:null,msg:'',confirmed:false};

const names={
 apprentice:'APPRENTICE',
 scholar:'SCHOLAR',
 alchemist:'ALCHEMIST',
 master:'MASTER BUDGETBINDER'
};

function hot(action,style,cls=''){
  return `<button class="hot ${cls}" data-action="${action}" style="${style}" aria-label="${action}"></button>`;
}

function render(){
  if(s.screen===1){
    app.innerHTML=`<div class="stage">
      <img class="screen" src="assets/01_welcome.png" alt="Welcome to The Binder's Quest">
      ${hot('next','left:10%;right:10%;top:89%;height:6%')}
    </div>`;
    return;
  }

  if(s.screen===2){
    app.innerHTML=`<div class="stage">
      <img class="screen" src="assets/02_how_it_works.png" alt="How It Works">
      ${hot('next','left:13%;right:13%;top:91.5%;height:6%')}
    </div>`;
    return;
  }

  const selected=p=>s.path===p?'path selected':'path';

  app.innerHTML=`<div class="stage">
    <img class="screen" src="assets/03_choose_your_path.png" alt="Choose Your Path">

    ${hot('pick-apprentice','left:3%;right:3%;top:36.8%;height:13.6%',selected('apprentice'))}
    ${hot('pick-scholar','left:3%;right:3%;top:49.5%;height:13.7%',selected('scholar'))}
    ${hot('pick-alchemist','left:3%;right:3%;top:62.2%;height:13.7%',selected('alchemist'))}
    ${hot('pick-master','left:3%;right:3%;top:74.9%;height:13.7%',selected('master'))}

    ${hot('confirm','left:14%;right:14%;top:91.0%;height:5.7%')}

    ${s.msg?`<div class="msg">${s.msg}</div>`:''}
    ${s.confirmed?`<div class="modal"><div class="box">
      <h2>PATH CONFIRMED</h2>
      <p>You chose <b>${names[s.path]}</b>.</p>
      <p>Opening-screen playtest complete.</p>
      <button data-action="close">RETURN</button>
    </div></div>`:''}
  </div>`;
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');
  if(!b)return;
  const a=b.dataset.action;

  if(a==='next'){s.screen++;s.msg='';}
  else if(a.startsWith('pick-')){s.path=a.slice(5);s.msg='';}
  else if(a==='confirm'){
    if(!s.path)s.msg='Choose your Path first.';
    else{s.confirmed=true;s.msg='';}
  }
  else if(a==='close')s.confirmed=false;

  render();
  window.scrollTo(0,0);
});

render();
</script>
</body>
</html>
